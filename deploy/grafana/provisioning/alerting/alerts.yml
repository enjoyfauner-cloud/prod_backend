# Правила алертов Grafana (unified alerting), загружаются при старте.
apiVersion: 1
groups:
  - orgId: 1
    name: sovetnik-api
    folder: Sovetnik
    interval: 1m
    rules:
      - uid: sovetnik-5xx-ratio
        title: "Доля 5xx > 5% (5 мин)"
        condition: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API отдаёт много ошибок 5xx"
          description: "Проверьте логи по request_id и /ready (БД)."
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                (sum(rate(http_requests_total{status=~"5.."}[5m])) or vector(0))
                / clamp_min(sum(rate(http_requests_total[5m])), 1e-9)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
      - uid: sovetnik-p95-latency
        title: "p95 латентности > 500 мс (5 мин)"
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API отвечает медленно"
          description: "Смотрите панель «Время расчёта» и нагрузку на БД."
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{route!="/health"}[5m])))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.5] }
