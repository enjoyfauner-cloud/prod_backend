name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: install (.venv, как локально)
        run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - name: ruff
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: install (.venv, как локально)
        run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - name: pyright
        run: .venv/bin/pyright

  test:
    runs-on: ubuntu-latest
    needs: typecheck
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sovetnik
          POSTGRES_PASSWORD: sovetnik
          POSTGRES_DB: sovetnik_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sovetnik"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://sovetnik:sovetnik@localhost:5432/sovetnik_test
      DATABASE_URL: postgresql+asyncpg://sovetnik:sovetnik@localhost:5432/sovetnik_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: install (.venv, как локально)
        run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - name: unit + integration tests
        run: .venv/bin/pytest -q
      - name: migrations up → down → up
        run: >-
          .venv/bin/alembic upgrade head && .venv/bin/alembic downgrade base &&
          .venv/bin/alembic upgrade head && .venv/bin/alembic check

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          build-args: APP_VERSION=${{ github.sha }}
          # Тег = git sha: откат = перезапуск с предыдущим тегом
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
