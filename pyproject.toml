[project]
name = "sovetnik-backend"
version = "1.0.0"
description = "Советник — какую карту выбрать для покупки (backend)"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["hello_world"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.pyright]
include = ["app", "tests", "scripts", "alembic"]
exclude = ["hello_world", ".venv"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: требует PostgreSQL (TEST_DATABASE_URL)"]
